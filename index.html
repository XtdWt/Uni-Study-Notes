<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          #F2F2EE;
      --surface:     #FFFFFF;
      --accent:      #2E4D8F;
      --text-primary:   #18181B;
      --text-secondary: #71717A;
      --border:      #D4D4D8;
      --shadow:      0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
      --header-h:    56px;
      --nav-h:       44px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    #site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: var(--header-h);
    }

    .site-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: -0.01em;
    }

    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--accent);
      background: transparent;
      border: 1.5px solid var(--accent);
      padding: 0.35rem 0.9rem;
      border-radius: 5px;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .btn-download:hover { background: var(--accent); color: var(--surface); }

    #subject-nav {
      position: sticky;
      top: var(--header-h);
      z-index: 90;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      overflow-x: auto;
      padding: 0 1.5rem;
      gap: 0.25rem;
      scrollbar-width: none;
    }
    #subject-nav::-webkit-scrollbar { display: none; }

    .nav-tab {
      flex-shrink: 0;
      padding: 0 0.85rem;
      height: var(--nav-h);
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .nav-tab:hover { color: var(--text-primary); }
    .nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    #content {
      max-width: 820px;
      margin: 2rem auto;
      padding: 0 1.5rem 4rem;
    }

    .page-object {
      display: block;
      width: 100%;
      aspect-ratio: 210 / 297;
      background: var(--surface);
      border-radius: 3px;
      box-shadow: var(--shadow);
      margin-bottom: 1.75rem;
    }

    .state-msg {
      text-align: center;
      padding: 5rem 0;
      color: var(--text-secondary);
      font-size: 0.875rem;
      line-height: 1.6;
    }
    .state-msg strong {
      display: block;
      color: var(--text-primary);
      font-size: 0.9375rem;
      margin-bottom: 0.4rem;
    }

    /* ── Responsive ──────────────────────────────── */

    @media (max-width: 600px) {
      #site-header { padding: 0 1rem; }
      #subject-nav { padding: 0 0.5rem; }
      #content     { padding: 0 0.75rem 3rem; margin-top: 1.25rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .nav-tab, .btn-download { transition: none; }
    }
  </style>
</head>
<body>

  <header id="site-header">
    <span class="site-title">Notes</span>
    <a id="download-btn" class="btn-download" style="visibility:hidden">↓ PDF</a>
  </header>

  <nav id="subject-nav" role="tablist" aria-label="Subjects"></nav>

  <main id="content" role="main"></main>

  <script src="svg_load.js" defer></script>
</body>
</html>
